apis:
  - aid: endeavor:content-api
    name: WME Group Content API (WordPress REST wp/v2)
    description: >-
      The corporate site of WME Group — the renamed Endeavor Group Holdings — runs WordPress and
      exposes the WordPress REST API at https://wmegrp.com/wp-json/. The wp/v2 namespace is
      anonymously readable and returns the company's press releases, corporate pages, media library,
      taxonomies and a site-wide search endpoint as JSON. This is the CMS's content API, NOT a
      product API: Endeavor / WME Group publishes no developer program, no documentation and no
      OpenAPI. The OpenAPI in this repository was derived mechanically by API Evangelist from the
      route-discovery document and is stamped x-provider-published: false.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/endeavor.png
    humanURL: https://wmegrp.com/
    baseURL: https://wmegrp.com/wp-json/wp/v2
    tags:
      - Content
      - CMS
      - Press Releases
    properties:
      - type: OpenAPI
        url: openapi/endeavor-content-api-openapi.yml
      - type: ErrorCatalog
        url: errors/endeavor-problem-types.yml
      - type: RateLimits
        url: rate-limits/endeavor-rate-limits.yml
  - aid: endeavor:mcp
    name: WME Group MCP Server (WordPress MCP Adapter)
    description: >-
      A Model Context Protocol server endpoint advertised in the wmegrp.com WordPress REST route
      index under the "mcp" namespace and served at /wp-json/mcp/mcp-adapter-default-server. The
      namespace index answers HTTP 200 and the endpoint is live, but it is authentication-gated: an
      anonymous JSON-RPC tools/list returns HTTP 401 rest_forbidden, as does the companion
      wp-abilities/v1 registry, so the published tool set could not be enumerated. This is the
      corporate site CMS's MCP endpoint, not a WME Group product MCP server.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/endeavor.png
    humanURL: https://wmegrp.com/wp-json/mcp
    baseURL: https://wmegrp.com/wp-json/mcp/mcp-adapter-default-server
    tags:
      - MCP
      - Agents
    properties:
      - type: MCPServer
        url: mcp/endeavor-mcp.yml
      - type: ToolCrosswalk
        url: mcp/endeavor-tool-crosswalk.yml
