apis:
- aid: endeavor:mcp
  name: WME Group MCP Server (WordPress MCP Adapter)
  description: >-
    A Model Context Protocol server endpoint advertised in the wmegrp.com WordPress REST route index under
    the "mcp" namespace and served at /wp-json/mcp/mcp-adapter-default-server. The namespace index answers
    HTTP 200 and the endpoint is live, but it is authentication-gated: an anonymous JSON-RPC tools/list
    returns HTTP 401 rest_forbidden, as does the companion wp-abilities/v1 registry, so the published
    tool set could not be enumerated. This is the corporate site CMS's MCP endpoint, not a WME Group product
    MCP server.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/endeavor.png
  humanURL: https://wmegrp.com/wp-json/mcp
