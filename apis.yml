aid: endeavor
name: Endeavor
description: >-
  Endeavor was a global sports and entertainment company representing talent
  and owning and operating events, with subsidiaries including WME, IMG, and
  UFC. Following the 2024 take-private transaction by Silver Lake and the
  separation of TKO Group Holdings (UFC and WWE), the remaining talent, media,
  marketing, and licensing businesses were rebranded as WME Group. This
  repository tracks Endeavor as a corporate entity. It publishes no developer program,
  no API documentation and no OpenAPI; the only machine-readable surfaces on its own hosts are the
  wmegrp.com WordPress content API, which is anonymously readable, and a live but
  authentication-gated WordPress MCP Adapter endpoint.
kind: contract
deliveryModel:
  model: unknown
  open_source: false
  commercial: false
  callable_host: false
  label: Delivery model not determined — needs a product licence on record
  confidence: low
  source:
  - none
  generated: '2026-08-28'
  method: derived
accessModel:
  pricing: free
  onboarding: none
  trial: false
  try_now: true
  public: true
  label: Free · no signup
  confidence: medium
  source:
  - url: https://wmegrp.com/wp-json/wp/v2/posts?per_page=1
    status: 200
    note: >-
      Anonymous GET returned HTTP 200 with content on 2026-09-06 — the only API surface the company
      serves is its corporate site's WordPress content API, which needs no key, no account and no
      plan. There is nothing to buy and nothing to sign up for, so this is free-and-open access to a
      CMS surface, NOT a commercial API product.
  generated: '2026-09-06'
  method: probed
position: Consuming
access: 3rd-Party
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/endeavor.png
