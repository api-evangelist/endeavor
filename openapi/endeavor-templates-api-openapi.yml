      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                author:
                  type: integer
                  description: The ID for the author of the template.
                content:
                  type: object
                  default: ''
                  description: Content of template.
                description:
                  type: string
                  default: ''
                  description: Description of template.
                slug:
                  type: string
                  description: Unique slug identifying the template.
                status:
                  type: string
                  enum:
                  - publish
                  - future
                  - draft
                  - pending
                  - private
                  - acf-disabled
                  default: publish
                  description: Status of template.
                theme:
                  type: string
                  description: Theme identifier for the template.
                title:
                  type: object
                  default: ''
                  description: Title of template.
                type:
                  type: string
                  description: Type of template.
              required:
              - slug
      security:
      - applicationPassword: []
      description: Write operation. Requires an authenticated WordPress user with the capability the route enforces; anonymous callers receive HTTP 401 rest_forbidden.
