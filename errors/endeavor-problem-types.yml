generated: '2026-09-06'
method: probed
source: >-
  Live anonymous probes of https://wmegrp.com/wp-json/wp/v2/* on 2026-09-06, plus the response
  envelope declared in openapi/endeavor-content-api-openapi.yml. Endeavor / WME Group publishes no
  error reference; every code below was OBSERVED in a real response body, not copied from docs.
format: wordpress-rest
rfc9457: false
content_type: application/json
envelope:
  shape: '{"code": "<slug>", "message": "<human text>", "data": {"status": <http status>}}'
  fields:
  - name: code
    description: Machine-readable error slug. This is the field an agent should branch on.
  - name: message
    description: Human-readable English message. Not stable; not a contract.
  - name: data.status
    description: The HTTP status code, repeated inside the body.
  missing:
  - type (no problem-type URI)
  - instance
  - documentation URL
  - retry hint
problem_types:
